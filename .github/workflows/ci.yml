# Kontroller på varje push och pull request: typer, lint och enhetstester.
# Bygget körs även här så att verifiering inte kräver en fungerande Vercel-preview.
# Typkontrollen körs separat eftersom bygget hoppar över den
# (next.config.ts har ignoreBuildErrors eftersom Next 16:s typkontroll
# tar slut på minne i bygget).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typer
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Enhetstester
        run: npm run test
      - name: Produktionsbygge
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
